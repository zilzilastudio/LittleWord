<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zilzila Studio - WebAR Experience</title>

  <!-- Stable A-Frame 1.2.0 + MindAR 1.2.5 CDN Combo -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #p5-container { display: none; }
  </style>

  <script>
    // Live p5.js Canvas Texture Bridge Component
    AFRAME.registerComponent('p5-canvas-texture', {
      init: function () {
        this.canvas = document.getElementById('p5-canvas');
        this.texture = null;
      },
      tick: function () {
        if (!this.canvas) {
          this.canvas = document.getElementById('p5-canvas');
          return;
        }
        let mesh = this.el.getObject3D('mesh');
        if (mesh && mesh.material) {
          if (!this.texture) {
            this.texture = new THREE.CanvasTexture(this.canvas);
            mesh.material.map = this.texture;
            mesh.material.transparent = true;
            mesh.material.needsUpdate = true;
          } else {
            this.texture.needsUpdate = true;
          }
        }
      }
    });

    // Touch / Mouse Rotation Control
    AFRAME.registerComponent('drag-rotate', {
      init: function () {
        let el = this.el;
        let isDragging = false;
        let lastX = 0;

        window.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          let deltaX = e.clientX - lastX;
          let rot = el.getAttribute('rotation');
          el.setAttribute('rotation', { x: rot.x, y: rot.y + deltaX * 0.8, z: rot.z });
          lastX = e.clientX;
        });

        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) { isDragging = true; lastX = e.touches[0].clientX; }
        });
        window.addEventListener('touchend', () => { isDragging = false; });
        window.addEventListener('touchmove', (e) => {
          if (!isDragging || e.touches.length !== 1) return;
          let deltaX = e.touches[0].clientX - lastX;
          let rot = el.getAttribute('rotation');
          el.setAttribute('rotation', { x: rot.x, y: rot.y + deltaX * 0.8, z: rot.z });
          lastX = e.touches[0].clientX;
        });
      }
    });
  </script>

  <script src="./sketch.js"></script>
</head>
<body>

  <div id="p5-container"></div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiError: yes;" 
    color-space="sRGB" 
    embedded 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" drag-rotate>
      
      <!-- Solid Blue Ground Floor Card -->
      <a-plane 
        position="0 -0.5 0" 
        rotation="-90 0 0" 
        width="1.2" 
        height="1.2" 
        color="#1642FA">
      </a-plane>

      <!-- Front View Fountain Plane -->
      <a-plane 
        p5-canvas-texture 
        position="0 0 0.01" 
        width="1" 
        height="1">
      </a-plane>

      <!-- Back View Fountain Plane (360° visibility) -->
      <a-plane 
        p5-canvas-texture 
        position="0 0 -0.01" 
        rotation="0 180 0" 
        width="1" 
        height="1">
      </a-plane>

    </a-entity>
  </a-scene>

</body>
</html>
